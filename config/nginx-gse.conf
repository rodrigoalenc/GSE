# Include this file inside http {}. Adapt host/certificate/socket and validate nginx -t.
# Bound work before PHP even for query-string route aliases. NAT-aware shared bursts;
# tune against measured school traffic, never trust forwarded IPs without a trusted proxy.
limit_req_zone $binary_remote_addr zone=gse_dynamic:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gse_connections:10m;
server {
    listen 80;
    server_name gse.escola.example;
    return 308 https://gse.escola.example$request_uri;
}
server {
    listen 443 ssl;
    server_name gse.escola.example;
    ssl_certificate /etc/letsencrypt/live/gse.escola.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gse.escola.example/privkey.pem;
    root /var/www/gse/public;
    index index.php;
    autoindex off;
    disable_symlinks on;
    client_max_body_size 12m;
    error_page 429 = @gse_rate_limited;

    location @gse_rate_limited {
        default_type text/plain;
        add_header Retry-After 1 always;
        return 429 "Muitas tentativas. Aguarde antes de tentar novamente.\n";
    }

    location ~* ^/(?:uploads|src|vendor|tests|bin|database|backups|logs|storage|config)(?:/|$) { return 404; }
    location ~ /\. { return 404; }
    # Route encrypted downloads through authentication; never serve a static file here.
    location ~ "^/backup/baixar/escola_backup_MANUAL_[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}(?:_[a-f0-9]{32})?\.db\.gse$" { rewrite ^ /index.php last; }
    location ~* \.(?:env|sqlite3?|db|gse|sql|log|pem|key|bak|backup|lock|ini|json|ya?ml)(?:[-.]|$) { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        limit_req zone=gse_dynamic burst=60 nodelay;
        limit_req_status 429;
        limit_conn gse_connections 40;
        limit_conn_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php(?:/|$) { return 404; }
}
