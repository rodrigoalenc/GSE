name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: PHP 8.3
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, intl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Instalação limpa
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar Composer
        run: composer validate --strict

      - name: Auditar dependências
        run: composer audit --locked

      - name: Verificar sintaxe PHP
        run: composer lint

      - name: Análise estática (PHPStan nível 6)
        run: composer analyse

      - name: PHPUnit
        run: composer test

      - name: Integração HTTP
        run: composer http-test

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Sintaxe e navegação no Chrome isolado
        run: |
          node --check public/assets/js/app.js
          node tests/browser-contract-tabs.mjs
